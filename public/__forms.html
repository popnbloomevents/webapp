<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Pop'n Bloom form registration</title></head>
  <body>
    <form name="event-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="event-inquiry">
      <input name="bot-field"><input name="name"><input name="email" type="email">
      <input name="phone" type="tel"><input name="event-date" type="date">
      <input name="location"><input name="event-type"><input name="approximate-budget">
      <input name="services"><textarea name="message"></textarea>
    </form>
  </body>
</html>
